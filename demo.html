<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fantoccini Demo - Timeline</title>
	<style>
		body {
			margin: 0;
			padding: 20px;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background-color: #0a0a0a;
			color: #ffffff;
		}
		
		.container {
			max-width: 800px;
			margin: 0 auto;
		}
		
		h1 {
			color: #ff00ff;
			margin-bottom: 20px;
		}
		
		.timeline-demo {
			background-color: #1a1a1a;
			border-radius: 8px;
			padding: 20px;
			margin-bottom: 20px;
		}
		
		.timeline-demo h2 {
			color: #ffcc00;
			margin-top: 0;
		}
		
		#animation-container {
			width: 100%;
			height: 300px;
			background-color: #2a2a2a;
			border-radius: 8px;
			position: relative;
			overflow: hidden;
		}
		
		.animated-box {
			position: absolute;
			width: 50px;
			height: 50px;
			background-color: #00ff88;
			border-radius: 4px;
			top: 50%;
			left: 0;
			transform: translateY(-50%);
			transition: none;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>Fantoccini Demo - Timeline</h1>
		
		<div class="timeline-demo">
			<h2>Timeline Animation Demo</h2>
			<p>This demonstrates the Timeline system with a simple animation</p>
			<div id="animation-container">
				<div class="animated-box" id="box"></div>
			</div>
			<button id="play-animation">Play Animation</button>
			<button id="reset-animation">Reset</button>
		</div>
	</div>
	
	<!-- Demo-specific entry point -->
	<script type="module" src="/src/demo.ts"></script>
</body>
</html>
