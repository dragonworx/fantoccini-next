<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>3D Sprites & Animation Demo - Fantoccini</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			overflow: hidden;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background-color: #0a0a0a;
			display: flex;
		}
		
		#canvas-container {
			flex: 1;
			height: 100vh;
			position: relative;
		}
		
		.controls {
			width: 320px;
			height: 100vh;
			background-color: #1a1a1a;
			padding: 20px;
			color: white;
			overflow-y: auto;
			box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
			flex-shrink: 0;
		}
		
		.controls h2 {
			margin-top: 0;
			color: #00ff88;
			font-size: 18px;
			margin-bottom: 15px;
		}
		
		.control-group {
			margin-bottom: 15px;
		}
		
		.control-group label {
			display: block;
			margin-bottom: 5px;
			font-size: 14px;
			color: #ccc;
		}
		
		.control-group button {
			background-color: #00ff88;
			color: #0a0a0a;
			border: none;
			padding: 8px 12px;
			border-radius: 4px;
			font-size: 13px;
			font-weight: 600;
			cursor: pointer;
			transition: background-color 0.2s;
			margin-right: 5px;
			margin-bottom: 5px;
			white-space: nowrap;
		}
		
		.control-group button:hover {
			background-color: #00cc6a;
		}
		
		.control-group button:active {
			transform: translateY(1px);
		}
		
		.control-group button.active {
			background-color: #ff6b6b;
		}
		
		.slider-group {
			margin-bottom: 10px;
		}
		
		.slider-group input[type="range"] {
			width: 100%;
			margin-top: 5px;
		}
		
		.slider-value {
			display: inline-block;
			width: 50px;
			text-align: right;
			color: #00ccff;
			font-family: monospace;
		}
		
		.stats {
			margin-top: 20px;
			padding-top: 20px;
			border-top: 1px solid #333;
			font-size: 12px;
			color: #888;
		}
		
		.stats div {
			margin-bottom: 5px;
		}
		
		.back-link {
			display: inline-block;
			color: #00ccff;
			text-decoration: none;
			background: rgba(0, 204, 255, 0.1);
			padding: 10px 20px;
			border-radius: 4px;
			margin-bottom: 20px;
			width: 100%;
			text-align: center;
			box-sizing: border-box;
		}
		
		.back-link:hover {
			background: rgba(0, 204, 255, 0.2);
		}
		
		.help-text {
			margin-top: 20px;
			padding-top: 20px;
			border-top: 1px solid #333;
			color: #888;
			font-size: 13px;
			line-height: 1.6;
		}
		
		.help-text kbd {
			background: #333;
			padding: 2px 6px;
			border-radius: 3px;
			margin: 0 2px;
		}
		
		.selected-info {
			margin-top: 15px;
			padding: 10px;
			background: #2a2a2a;
			border-radius: 4px;
			font-size: 12px;
		}
		
		.selected-info.hidden {
			display: none;
		}
	</style>
</head>
<body>
	<div class="controls">
		<a href="/" class="back-link">← Back to demos</a>
		<h2>3D Sprites & Animation Demo</h2>
		
		<div class="control-group">
			<label>3D Objects</label>
			<button id="add-cube">Add Cube</button>
			<button id="add-sphere">Add Sphere</button>
			<button id="add-torus">Add Torus</button>
			<button id="add-many">Add 20 Random</button>
			<button id="clear-all">Clear All</button>
		</div>
		
		<div class="control-group">
			<label>Animations</label>
			<button id="anim-rotate" class="active">Rotate</button>
			<button id="anim-bounce">Bounce</button>
			<button id="anim-orbit">Orbit</button>
			<button id="anim-wave">Wave</button>
			<button id="stop-animation">Stop All</button>
		</div>
		
		<div class="control-group">
			<label>Helpers</label>
			<button id="toggle-grid">Toggle Grid</button>
			<button id="toggle-axes">Toggle Axes</button>
			<button id="toggle-shadows">Toggle Shadows</button>
		</div>
		
		<div class="control-group">
			<label>Animation Speed</label>
			<div class="slider-group">
				<input type="range" id="speed-slider" min="0" max="200" value="100">
				<span class="slider-value" id="speed-value">100%</span>
			</div>
		</div>
		
		<div class="selected-info hidden" id="selected-info">
			<strong>Selected Object</strong>
			<div>Type: <span id="selected-type">-</span></div>
			<div>Position: <span id="selected-pos">-</span></div>
			<div>Material: <span id="selected-mat">-</span></div>
		</div>
		
		<div class="stats">
			<div>Objects: <span id="object-count">0</span></div>
			<div>FPS: <span id="fps">0</span></div>
			<div>Render Time: <span id="render-time">0</span>ms</div>
		</div>
		
		<div class="help-text">
			<strong>Controls:</strong><br>
			<kbd>Left Click + Drag</kbd> to orbit<br>
			<kbd>Right Click + Drag</kbd> to pan<br>
			<kbd>Scroll</kbd> to zoom<br>
			<kbd>Click</kbd> objects to select
		</div>
	</div>
	
	<div id="canvas-container"></div>
	
	<script type="module" src="/src/ui-3d-demo.ts"></script>
</body>
</html>
