<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Three.js Demo - Boxes with Bone</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background-color: #0a0a0a;
			color: #ffffff;
			overflow: hidden;
		}
		
		#canvas-container {
			width: 100vw;
			height: 100vh;
			position: relative;
		}
		
		.controls {
			position: absolute;
			top: 20px;
			left: 20px;
			background-color: rgba(26, 26, 26, 0.9);
			padding: 20px;
			border-radius: 8px;
			backdrop-filter: blur(10px);
		}
		
		.controls h2 {
			margin-top: 0;
			color: #00ff88;
			font-size: 18px;
		}
		
		.control-group {
			margin-bottom: 15px;
		}
		
		label {
			display: block;
			margin-bottom: 5px;
			font-size: 14px;
		}
		
		input[type="range"] {
			width: 200px;
			height: 6px;
			-webkit-appearance: none;
			appearance: none;
			background: #333;
			outline: none;
			border-radius: 3px;
		}
		
		input[type="range"]::-webkit-slider-thumb {
			-webkit-appearance: none;
			appearance: none;
			width: 16px;
			height: 16px;
			background: #00ff88;
			cursor: pointer;
			border-radius: 50%;
		}
		
		input[type="range"]::-moz-range-thumb {
			width: 16px;
			height: 16px;
			background: #00ff88;
			cursor: pointer;
			border-radius: 50%;
			border: none;
		}
		
		#rotation-value {
			display: inline-block;
			width: 50px;
			text-align: right;
			color: #00ccff;
			font-family: 'Courier New', monospace;
		}
		
		.info {
			position: absolute;
			bottom: 20px;
			left: 20px;
			font-size: 12px;
			color: #888;
		}
		
		.info code {
			color: #00ccff;
			background-color: rgba(0, 204, 255, 0.1);
			padding: 2px 4px;
			border-radius: 3px;
		}
	</style>
</head>
<body>
	<div id="canvas-container"></div>
	
	<div class="controls">
		<h2>Bone Rotation Control</h2>
		<div class="control-group">
			<label for="rotation-slider">
				Rotation: <span id="rotation-value">0°</span>
			</label>
			<input 
				type="range" 
				id="rotation-slider" 
				min="0" 
				max="360" 
				value="0" 
				step="1"
			>
		</div>
	</div>
	
	<div class="info">
		<p>Three.js clock demo with skeletal animation system</p>
		<p>Red cylinder (clock face) with actual bone system</p>
		<p>Green sphere attached to bone tip - visualized with SkeletonHelper</p>
		<p>Use slider to rotate: <code>0° - 360°</code></p>
	</div>
	
	<!-- Three.js demo entry point -->
	<script type="module" src="/src/threejs-demo.ts"></script>
</body>
</html>
