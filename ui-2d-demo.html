<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2D UI Elements Demo - Fantoccini</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			overflow: hidden;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background-color: #0a0a0a;
		}
		
		#canvas-container {
			width: 100vw;
			height: 100vh;
			position: relative;
		}
		
		.controls {
			position: absolute;
			top: 20px;
			left: 20px;
			background-color: rgba(26, 26, 26, 0.9);
			padding: 20px;
			border-radius: 8px;
			backdrop-filter: blur(10px);
			color: white;
			z-index: 100;
			min-width: 250px;
		}
		
		.controls h2 {
			margin-top: 0;
			color: #00ff88;
			font-size: 18px;
			margin-bottom: 15px;
		}
		
		.control-group {
			margin-bottom: 15px;
		}
		
		.control-group label {
			display: block;
			margin-bottom: 5px;
			font-size: 14px;
			color: #ccc;
		}
		
		.control-group button {
			background-color: #00ff88;
			color: #0a0a0a;
			border: none;
			padding: 8px 16px;
			border-radius: 4px;
			font-size: 14px;
			font-weight: 600;
			cursor: pointer;
			transition: background-color 0.2s;
			margin-right: 10px;
			margin-bottom: 5px;
		}
		
		.control-group button:hover {
			background-color: #00cc6a;
		}
		
		.control-group button:active {
			transform: translateY(1px);
		}
		
		.stats {
			margin-top: 20px;
			padding-top: 20px;
			border-top: 1px solid #333;
			font-size: 12px;
			color: #888;
		}
		
		.stats div {
			margin-bottom: 5px;
		}
		
		.back-link {
			position: absolute;
			top: 20px;
			right: 20px;
			color: #00ccff;
			text-decoration: none;
			background: rgba(26, 26, 26, 0.9);
			padding: 10px 20px;
			border-radius: 4px;
			z-index: 100;
		}
		
		.back-link:hover {
			background: rgba(0, 204, 255, 0.2);
		}
		
		.help-text {
			position: absolute;
			bottom: 20px;
			left: 20px;
			color: #666;
			font-size: 14px;
			background: rgba(26, 26, 26, 0.9);
			padding: 10px 15px;
			border-radius: 4px;
		}
		
		.help-text kbd {
			background: #333;
			padding: 2px 6px;
			border-radius: 3px;
			margin: 0 2px;
		}
	</style>
</head>
<body>
	<div id="canvas-container"></div>
	
	<div class="controls">
		<h2>2D UI Elements Demo</h2>
		
		<div class="control-group">
			<label>Element Generation</label>
			<button id="add-random">Add Random Element</button>
			<button id="add-many">Add 50 Elements</button>
			<button id="clear-all">Clear All</button>
		</div>
		
		<div class="control-group">
			<label>Layout Patterns</label>
			<button id="layout-grid">Grid Layout</button>
			<button id="layout-circle">Circle Layout</button>
			<button id="layout-cascade">Cascade Layout</button>
			<button id="layout-random">Random Layout</button>
		</div>
		
		<div class="control-group">
			<label>Animation</label>
			<button id="animate-pulse">Pulse Animation</button>
			<button id="animate-rotate">Rotate Animation</button>
			<button id="stop-animation">Stop Animation</button>
		</div>
		
		<div class="stats">
			<div>Elements: <span id="element-count">0</span></div>
			<div>FPS: <span id="fps">0</span></div>
			<div>Render Time: <span id="render-time">0</span>ms</div>
			<div id="selected-info" style="color: #00ccff; margin-top: 10px; display: none;">
				Selected: <span id="selected-pos">-</span>
			</div>
		</div>
	</div>
	
	<a href="/" class="back-link">← Back to demos</a>
	
	<div class="help-text">
		<kbd>Click</kbd> to select • <kbd>Arrow Keys</kbd> to move • <kbd>Space</kbd> to rotate • <kbd>Delete</kbd> to remove • <kbd>Any Key</kbd> for visual feedback
		<br>
		<small>Mouse over for hover effects • Click and drag for press effects • Selected element has blue border</small>
	</div>
	
	<script type="module" src="/src/ui-2d-demo.ts"></script>
</body>
</html>
