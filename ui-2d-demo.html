<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2D UI Elements Demo - Fantoccini</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			overflow: hidden;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background-color: #0a0a0a;
			display: flex;
		}
		
		#canvas-container {
			flex: 1;
			height: 100vh;
			position: relative;
		}
		
		.controls {
			width: 320px;
			height: 100vh;
			background-color: #1a1a1a;
			padding: 20px;
			color: white;
			overflow-y: auto;
			box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
			flex-shrink: 0;
		}
		
		.controls h2 {
			margin-top: 0;
			color: #00ff88;
			font-size: 18px;
			margin-bottom: 15px;
		}
		
		.control-group {
			margin-bottom: 15px;
		}
		
		.control-group label {
			display: block;
			margin-bottom: 5px;
			font-size: 14px;
			color: #ccc;
		}
		
		.control-group button {
			background-color: #00ff88;
			color: #0a0a0a;
			border: none;
			padding: 8px 12px;
			border-radius: 4px;
			font-size: 13px;
			font-weight: 600;
			cursor: pointer;
			transition: background-color 0.2s;
			margin-right: 5px;
			margin-bottom: 5px;
			white-space: nowrap;
		}
		
		.control-group button:hover {
			background-color: #00cc6a;
		}
		
		.control-group button:active {
			transform: translateY(1px);
		}
		
		.stats {
			margin-top: 20px;
			padding-top: 20px;
			border-top: 1px solid #333;
			font-size: 12px;
			color: #888;
		}
		
		.stats div {
			margin-bottom: 5px;
		}
		
		.back-link {
			display: inline-block;
			color: #00ccff;
			text-decoration: none;
			background: rgba(0, 204, 255, 0.1);
			padding: 10px 20px;
			border-radius: 4px;
			margin-bottom: 20px;
			width: 100%;
			text-align: center;
			box-sizing: border-box;
		}
		
		.back-link:hover {
			background: rgba(0, 204, 255, 0.2);
		}
		
		.help-text {
			margin-top: 20px;
			padding-top: 20px;
			border-top: 1px solid #333;
			color: #888;
			font-size: 13px;
			line-height: 1.6;
		}
		
		.help-text kbd {
			background: #333;
			padding: 2px 6px;
			border-radius: 3px;
			margin: 0 2px;
		}
	</style>
</head>
<body>
	<div class="controls">
		<a href="/" class="back-link">← Back to demos</a>
		<h2>2D UI Elements Demo</h2>
		
		<div class="control-group">
			<label>Element Generation</label>
			<button id="add-random">Add Random Element</button>
			<button id="add-many">Add 50 Elements</button>
			<button id="clear-all">Clear All</button>
		</div>
		
		<div class="control-group">
			<label>Layout Patterns</label>
			<button id="layout-grid">Grid Layout</button>
			<button id="layout-circle">Circle Layout</button>
			<button id="layout-cascade">Cascade Layout</button>
			<button id="layout-random">Random Layout</button>
		</div>
		
		<div class="control-group">
			<label>Animation</label>
			<button id="animate-pulse">Pulse Animation</button>
			<button id="animate-rotate">Rotate Animation</button>
			<button id="stop-animation">Stop Animation</button>
		</div>
		
		<div class="stats">
			<div>Elements: <span id="element-count">0</span></div>
			<div>FPS: <span id="fps">0</span></div>
			<div>Render Time: <span id="render-time">0</span>ms</div>
			<div id="selected-info" style="color: #00ccff; margin-top: 10px; display: none;">
				Selected: <span id="selected-pos">-</span>
			</div>
		</div>
		
		<div class="help-text">
			<strong>Controls:</strong><br>
			<kbd>Click</kbd> to select<br>
			<kbd>Arrow Keys</kbd> to move<br>
			<kbd>Space</kbd> to rotate<br>
			<kbd>Delete</kbd> to remove<br>
			<kbd>Any Key</kbd> for visual feedback<br>
			<br>
			<strong>Mouse:</strong><br>
			• Hover for green border<br>
			• Click and drag for press effect<br>
			• Selected element has blue border
		</div>
	</div>
	
	<div id="canvas-container"></div>
	
	<script type="module" src="/src/ui-2d-demo.ts"></script>
</body>
</html>
