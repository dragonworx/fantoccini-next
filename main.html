<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fantoccini Test Page</title>
	<style>
		body {
			margin: 0;
			padding: 20px;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background-color: #0a0a0a;
			color: #ffffff;
		}
		
		.container {
			max-width: 800px;
			margin: 0 auto;
		}
		
		h1 {
			color: #00ff88;
			margin-bottom: 20px;
		}
		
		.demo-section {
			background-color: #1a1a1a;
			border-radius: 8px;
			padding: 20px;
			margin-bottom: 20px;
		}
		
		.demo-section h2 {
			color: #00ccff;
			margin-top: 0;
		}
		
		button {
			background-color: #00ff88;
			color: #0a0a0a;
			border: none;
			padding: 10px 20px;
			border-radius: 4px;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			transition: background-color 0.2s;
		}
		
		button:hover {
			background-color: #00cc6a;
		}
		
		button:active {
			transform: translateY(1px);
		}
		
		#metronome-status {
			margin-top: 10px;
			padding: 10px;
			background-color: #2a2a2a;
			border-radius: 4px;
			font-family: 'Courier New', monospace;
		}
		
		.log-entry {
			margin: 5px 0;
			padding: 5px;
			background-color: #333;
			border-radius: 3px;
			font-size: 14px;
		}
		
		.back-link {
			display: inline-block;
			margin-bottom: 20px;
			color: #00ccff;
			text-decoration: none;
		}
		
		.back-link:hover {
			text-decoration: underline;
		}
	</style>
</head>
<body>
	<div class="container">
		<a href="/" class="back-link">← Back to demos</a>
		<h1>Fantoccini Test Page</h1>
		
		<div class="demo-section">
			<h2>Metronome Demo</h2>
			<p>Test the core metronome functionality</p>
			<button id="start-metronome">Start Metronome</button>
			<button id="stop-metronome" style="display: none;">Stop Metronome</button>
			<div id="metronome-status">
				<div>Status: <span id="status">Stopped</span></div>
				<div>BPM: <span id="bpm">120</span></div>
				<div>Beat: <span id="beat">0</span></div>
			</div>
		</div>
		
		<div class="demo-section">
			<h2>Console Log</h2>
			<div id="console-log"></div>
		</div>
	</div>
	
	<!-- Entry point for your TypeScript/JavaScript code -->
	<script type="module" src="/src/main.ts"></script>
</body>
</html>
